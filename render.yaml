services:
  - type: web
    name: certificate-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: Platform__OrganizationName
        value: Clinically Evolve Foundation
      - key: Platform__InternalApiKey
        sync: false
      - key: Signing__PfxPassword
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: ENGINE_DLL_PATH
        value: /app/engine/CertificateEngine.dll
      - key: VERIFICATION_URL
        value: http://127.0.0.1:5001
