services:
  - type: web
    name: certificate-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: Platform__InternalApiKey
        generateValue: true
      - key: Platform__OrganizationName
        value: Clinically Evolve Foundation
      - key: Signing__PfxPassword
        sync: false
      - key: SIGNING_PFX_BASE64
        sync: false
      - key: TRUSTED_ROOT_PEM_BASE64
        sync: false
      - key: DATA_DIR
        value: /app/data
